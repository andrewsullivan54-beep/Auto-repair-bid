# codemagic.yaml — cloud builds for Auto Repair Bids (Capacitor)
#
# Andrew has no Mac, so the iPhone app is built here on Codemagic's Mac minis.
#
# SETUP (about 5 minutes, all in the browser — nothing to install):
#   1. Create a FREE account at https://codemagic.io (sign in with GitHub).
#   2. "Add application" -> connect this repo (push it to GitHub first).
#   3. In the app's settings, choose "codemagic.yaml" as the build
#      configuration (not the visual Workflow Editor).
#   4. Push to the main branch (or press "Start new build") — the
#      ios-android-debug workflow below runs automatically.

workflows:
  ios-android-debug:
    name: iOS (unsigned) + Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.autorepairbids.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      node: 24
      java: 21
      # ------------------------------------------------------------------
      # TODO — CODE SIGNING (needs Andrew's Apple Developer account, $99/yr)
      #
      # The "Build iOS app" step below produces an UNSIGNED archive: enough
      # to prove the app compiles on a real Mac. A signed .ipa (required for
      # TestFlight and the App Store) needs real Apple credentials:
      #
      #   1. Enroll in the Apple Developer Program on his Apple ID
      #      (developer.apple.com, $99/year).
      #   2. In Codemagic: Teams -> Code signing identities -> upload the iOS
      #      distribution certificate (.p12 file + its password).
      #   3. In the Apple Developer portal: create a provisioning profile for
      #      the bundle id com.autorepairbids.app, then upload it in the same
      #      Codemagic screen.
      #   4. Uncomment the ios_signing block below, and swap the "Build iOS
      #      app" script step for the signed "Build signed IPA" step that is
      #      provided (commented out) further down.
      # ------------------------------------------------------------------
      # ios_signing:
      #   distribution_type: ad_hoc   # or: app_store
      #   bundle_ids:
      #     - com.autorepairbids.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci
      - name: Sync Capacitor web assets into the native projects
        script: |
          npx cap sync
      - name: Build iOS app (unsigned archive — validates compilation)
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      # TODO — signed .ipa (see the CODE SIGNING note in environment above):
      # - name: Build signed IPA
      #   script: |
      #     keychain initialize
      #     xcode-project use-profiles
      #     xcode-project build-ipa \
      #       --workspace "$XCODE_WORKSPACE" \
      #       --scheme "$XCODE_SCHEME"
      - name: Build Android debug APK
        script: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
    artifacts:
      - App.xcarchive
      - android/app/build/outputs/apk/debug/*.apk
