<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Your Account — Auto Repair Bids</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="phone">
  <div class="topbar">
    <a class="back" href="/">‹</a>
    <div class="brand"><span class="car">🚗</span> AUTO REPAIR <b>BIDS</b></div>
    <span></span>
  </div>
  <div class="wrap">
    <h1 class="center" id="title">Create Your Account</h1>
    <p class="sub center" id="subtitle">It's free to use for customers.</p>

    <div class="err" id="err"></div>

    <label>Your name</label>
    <input type="text" id="name" placeholder="Full name" autocomplete="name">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label>Phone (optional)</label>
    <input type="tel" id="phone" placeholder="(513) 555-0100" autocomplete="tel">
    <label>Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">

    <button class="btn" id="go">Continue with Email</button>
    <button class="btn btn-ghost" id="google">🅶&nbsp; Continue with Google</button>

    <p class="sub center" style="margin-top:14px">Already have an account? <a href="/login.html" class="gold">Log In</a></p>
    <p class="hint center" style="margin-top:10px">By signing up, you agree to our Terms of Service and Privacy Policy.</p>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
<script>
const role = new URLSearchParams(location.search).get('role') === 'shop' ? 'shop' : 'customer';
if (role === 'shop') {
  document.getElementById('title').textContent = 'Create Your Shop Account';
  document.getElementById('subtitle').textContent = 'No monthly fees. You only pay when you win a customer.';
}
document.getElementById('google').onclick = () =>
  showErr('Google sign-in is coming soon — please continue with email for now.');
document.getElementById('go').onclick = async () => {
  clearErr();
  try {
    const r = await api('/api/signup', { method: 'POST', body: {
      role,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      phone: document.getElementById('phone').value
    }});
    location.href = r.role === 'shop' ? '/shop/onboarding.html' : '/customer/home.html';
  } catch (e) { showErr(e.message); }
};
</script>
</body>
</html>
